name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Smart Unzip & Clean Dependencies
        run: |
          echo "Extracting ZIP..."
          unzip -o *.zip || true

          # Find folder where package.json lives
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Project directory: $PROJECT_DIR"

          # Move files to root if nested
          if [ "$PROJECT_DIR" != "." ]; then
            cp -rf "$PROJECT_DIR"/* . || true
            cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi

          # Force remove all previous node_modules/locks
          rm -rf node_modules package-lock.json

      - name: Clean Install Node 20 Dependencies
        run: |
          npm install
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional || true

      - name: Build React Web App
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          
