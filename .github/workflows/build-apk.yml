name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip & Clean Project
        run: |
          echo "Extracting ZIP..."
          unzip -o *.zip || true

          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")

          if [ "$PROJECT_DIR" != "." ]; then
            cp -rf "$PROJECT_DIR"/* . || true
            cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi

          rm -rf node_modules package-lock.json

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/geolocation --save

      - name: Build React Web App
        run: npm run build

      - name: Auto-Configure & Sync Capacitor Android
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId": "com.sonu.gpsmapcamera", "appName": "GPS Map Camera", "webDir": "dist"}' > capacitor.config.json
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Fix SDK, minSdk & Force Compatible AndroidX Versions
        run: |
          echo "Fixing SDK and Dependency conflicts..."
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/g' android/variables.gradle
          fi
          
          # Lock androidx.core to version 1.15.0 compatible with AGP 8.7.2
          echo 'allprojects { configurations.all { resolutionStrategy { force "androidx.core:core-ktx:1.15.0", "androidx.core:core:1.15.0" } } }' >> android/build.gradle

      - name: Inject Android Native Permissions
        run: |
          node -e '
          const fs = require("fs");
          const file = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.location.gps" android:required="true" />
            `;
            if (!content.includes("android.permission.CAMERA")) {
              content = content.replace("<application", perms + "\n  <application");
              fs.writeFileSync(file, content, "utf8");
              console.log("Permissions injected successfully!");
            }
          }
          '

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          
