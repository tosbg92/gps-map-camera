name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Smart Unzip & Build APK
        run: |
          echo "Extracting ZIP file..."
          unzip -o *.zip
          
          # Find directory containing package.json
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          echo "Cleaning old node_modules & lockfiles..."
          rm -rf node_modules package-lock.json
          
          echo "Installing dependencies..."
          npm install
          
          echo "Building Web Assets..."
          npm run build
          
          echo "Syncing Capacitor..."
          npx cap sync android
          
          echo "Building Android Debug APK..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          
