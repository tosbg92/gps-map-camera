name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP & Flatten Directory
        run: |
          echo "Extracting zip..."
          unzip -o *.zip
          
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          echo "Found package.json at: $PKG_PATH"
          
          if [ -n "$PKG_PATH" ]; then
            TARGET_DIR=$(dirname "$PKG_PATH")
            if [ "$TARGET_DIR" != "." ]; then
              echo "Copying contents from $TARGET_DIR to root..."
              cp -rn "$TARGET_DIR"/* . || true
              cp -rn "$TARGET_DIR"/.* . 2>/dev/null || true
            fi
          fi

      - name: Clean Old node_modules & Locks
        run: |
          echo "Cleaning pre-existing node_modules..."
          rm -rf node_modules package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean Install Dependencies for Linux
        run: npm install

      - name: Build React Web App
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Executable Permission to Gradle
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew
          else
            echo "Android directory missing!"
            exit 1
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
