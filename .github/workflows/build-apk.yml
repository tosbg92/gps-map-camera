name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Smart Unzip & Deep Clean
        run: |
          echo "Starting Smart Extract..."
          
          # Create a temp directory to safely extract zip
          mkdir -p temp_extract
          unzip -o *.zip -d temp_extract/ || true
          
          # Find the exact folder containing package.json inside zip
          PKG_LOCATION=$(find temp_extract -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          SOURCE_DIR=$(dirname "$PKG_LOCATION")
          echo "Source code found at: $SOURCE_DIR"
          
          # Remove any bundled node_modules or package-lock inside zip to force clean Linux build
          rm -rf "$SOURCE_DIR/node_modules" "$SOURCE_DIR/package-lock.json"
          
          # Copy all clean files to current working directory
          cp -rf "$SOURCE_DIR"/* . /dev/null 2>&1 || true
          cp -rf "$SOURCE_DIR"/.* . /dev/null 2>&1 || true
          rm -rf temp_extract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fresh Install Linux Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --platform=linux --arch=x64

      - name: Build React Web App
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Executable Permission to Gradle
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew
          else
            echo "Android directory missing!"
            exit 1
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
