name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip & Clean Project
        run: |
          echo "Extracting ZIP..."
          unzip -o *.zip || true

          # Find folder where package.json lives
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")

          # Move files to root if nested
          if [ "$PROJECT_DIR" != "." ]; then
            cp -rf "$PROJECT_DIR"/* . || true
            cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi

          # Clean old modules
          rm -rf node_modules package-lock.json

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build React Web App
        run: npm run build

      - name: Auto-Configure & Sync Capacitor Android
        run: |
          # 1. Check & Create capacitor.config.json if missing
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId": "com.sonu.gpsmapcamera", "appName": "GPS Map Camera", "webDir": "dist"}' > capacitor.config.json
            echo "Auto-generated missing capacitor.config.json"
          fi

          # 2. Add Android platform if missing
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi

          # 3. Sync assets
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          
