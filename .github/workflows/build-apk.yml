name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip and Fix Directory Structure
        run: |
          echo "Unzipping file..."
          unzip -o *.zip || true

          # If code is nested inside gps-map-camera folder, move it to root
          if [ -d "gps-map-camera" ]; then
            echo "Moving inner folder files to root..."
            cp -rn gps-map-camera/* . || true
            cp -rn gps-map-camera/.* . 2>/dev/null || true
          fi

          # Forcefully clean any old Windows node_modules & lockfiles
          echo "Force cleaning pre-existing node_modules and lockfiles..."
          rm -rf node_modules package-lock.json
          find . -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
          find . -name "package-lock.json" -exec rm -rf {} + 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Linux Dependencies & Native Bindings
        run: |
          npm install --force
          npm rebuild

      - name: Build React Web App
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Executable Permission to Gradle
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew
          else
            echo "Android directory missing!"
            exit 1
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Map-Camera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
